function topbar(){
  const rt=route(); const back=rt.page==='project'?`<button class="ghost" data-nav="#/${KIND}" title="Back to every ${esc(PIPE.label.toLowerCase())} project">${ic('back')} ${esc(PIPE.label)}</button>`: rt.page==='slate'?`<button class="ghost" data-nav="#/" title="Back to the studio">${ic('back')} Studio</button>`:'';
  const conn=dbState==='on'?'Board connected':dbState==='connecting'?'Connecting to the board…':dbState==='demo'?'Example board, nothing is saved or sent':'Not connected';
  return `<header class="top">
    <div class="brand">${back}<a href="#/" data-home><img src="${LOGO}" alt="3echo"><span class="sep" aria-hidden="true"></span><h1>${rt.page==='home'?'Production Studio':esc(PIPE.label)}</h1></a></div>
    <div class="who">
      <span class="conn ${dbState==='on'?'on':dbState==='demo'?'demo':''}"><i></i>${conn}</span>
      <label>Acting as <select id="me" aria-label="Acting as">${HUMANS.map(h=>`<option value="${h.id}" ${h.id===me?'selected':''}>${h.label}</option>`).join('')}</select></label>
    </div>
  </header>`;
}
// Tokens as people read them: 287k, 1.2M.
function tok(n){ n=Number(n)||0; return n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e3?Math.round(n/1e3)+'k':String(n); }
function costLine(c){
  if(!c) return '';
  const parts=[];
  if(c.runs) parts.push(tok(c.tokens)+' tokens');
  if(c.creditsSpent!=null) parts.push(c.creditsSpent+' credit'+(c.creditsSpent===1?'':'s'));
  return parts.join(' · ');
}
// The project's cost from the runs this page already reads (so it is right even before the
// pipeline has pushed a tally), with credits from the tally tally-cost.js pushed.
function costRows(){
  return scopeItems().map(i=>{ const rs=runs[i.id]||[]; if(!rs.length) return null;
    let t=0,u=0,untr=0; const models=[]; rs.forEach(r=>{ if(r.tokens!=null) t+=Number(r.tokens)||0; else untr++; if(r.turns!=null) u+=Number(r.turns)||0; if(r.model&&!models.includes(r.model)) models.push(r.model); });
    return {id:i.id,name:i.name,t,u,n:rs.length,untr,models}; }).filter(Boolean);
}
function costBox(){
  const rows=costRows();
  const total=rows.reduce((a,r)=>a+r.t,0), turns=rows.reduce((a,r)=>a+r.u,0), n=rows.reduce((a,r)=>a+r.n,0), untr=rows.reduce((a,r)=>a+r.untr,0);
  const c=project&&project.cost||{};
  const credits=c.creditsSpent!=null?`<div class="seat-row"><span>3echo credits</span><b class="num">${c.creditsSpent} of ${c.creditsCeiling??'?'}</b></div>`:'';
  return `<div class="box"><h3>Cost <span>the agents' runs; the orchestrator is not counted</span></h3>
    ${n?`<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><b style="font-size:var(--t5)" class="num">${total.toLocaleString('en-US')}</b><span class="meta">tokens · ${n} run${n===1?'':'s'} · ${turns} turns${untr?` · ${untr} without a count`:''}</span></div>`:'<p class="empty">No runs recorded yet.</p>'}
    ${credits}
    ${rows.length?`<div class="seats">${rows.map(r=>`<button class="seat-row" data-open-item="${r.id}" data-open-tab="output" title="${esc(r.models.join(', '))} · ${r.u} turns"><span><b>${esc(r.name)}</b>${r.n>1?` · ${r.n} runs`:''}</span><span class="num">${tok(r.t)}${total?` · ${Math.round(r.t*100/total)}%`:''}</span></button>`).join('')}</div>`:''}
  </div>`;
}
function statusWord(s){ return {picture:'Picture',audio:'Audio',finish:'Finish',intake:'Intake',stage1:'Stage 1',gate_a:'At Gate A',stage2:'Stage 2',gate_b:'At Gate B',stage3:'Stage 3',gate_c:'At Gate C',released:'Released',killed:'Killed'}[s]||s||''; }
function demoOffer(){ return `<p class="empty" style="margin-top:20px">The board database is not reachable from this view.</p><div class="actions" style="margin-top:10px"><button data-demo>Open the example board</button>${route().page==='project'?`<button class="ghost" data-home>${ic('back')} All projects</button>`:''}</div>`; }
// One project on a slate. On the studio's home page the card also says which pipeline it is in.
function projectCard(p, tagged){
  const k=kindOf(p); const n=Array.isArray(p.steps)&&p.steps.length?p.steps.length:0;
  const sub=projSub(p).filter(Boolean).map(esc).join(' · ');
  const working=p.activity&&!['released','killed'].includes(p.status);
  return `<button class="pcard" data-open="${esc(p.id)}" style="--h:${hueOf(p.id)}">
      <span class="pc-top"><span class="pc-glass">${tagged?`<span class="pc-kind">${esc(PIPES[k].label)}</span>`:''}<h3>${esc(p.title)}</h3>${sub?`<span class="pc-sub">${sub}</span>`:''}</span></span>
      <span class="pc-body">
        <span class="pc-kv"><span>Opened</span><b>${fmt(p.createdAt)}</b><span>By</span><b>${esc(humanName(p.createdBy))}${p.example?' · example data':''}</b>${costLine(p.cost)?`<span>Cost</span><b class="num">${esc(costLine(p.cost))}</b>`:''}<span>${n?'Scope':'Gates'}</span><b>${n?`A la carte · ${n} step${n===1?'':'s'}`:`<span class="gchips" aria-label="Gates passed">${Object.keys(PIPES[k].GATES).map(x=>`<span class="gchip ${gateChipState(p,x)}">${x}</span>`).join('')}</span>`}</b></span>
        <span class="pill ${p.status==='released'?'approved':working?'running':'plain'}">${esc(statusWord(p.status))}</span>
      </span>
      ${working?`<span class="pc-act">${esc(p.activity)}${p.heartbeatAt?' · '+fmt(p.heartbeatAt):''}</span>`:''}
      <span class="pc-dots" aria-hidden="true"></span>
    </button>`;
}
// The studio's front page: the two pipelines as two doors, and everything in flight under them.
function homePage(){
  const live=projects.filter(p=>p.status!=='moved');
  const door=k=>{ const P=PIPES[k]; const mine=live.filter(p=>kindOf(p)===k); const busy=mine.filter(p=>p.activity&&!['released','killed'].includes(p.status)).length;
    return `<button class="hcard k-${k}" data-nav="#/${k}"><span class="mb-ic" aria-hidden="true">${ic(k==='pre'?'flow':'film')}</span><span class="mb-b"><span class="mb-t"><em>${esc(P.label)}.</em> ${esc(P.tag)}</span><span class="mb-s">${P.ITEMS.length} steps, ${Object.keys(P.GATES).length} gates · ${mine.length} project${mine.length===1?'':'s'}${busy?`, ${busy} working`:''}</span></span><span class="mb-btn">Open ${ic('arrow')}</span></button>`; };
  const cards = live.length ? live.map(p=>projectCard(p, true)).join('')
    : dbState==='off' ? demoOffer() : `<p class="empty">${dbState==='connecting'?'Connecting to the board…':'No projects on the board yet. Open one from Pre-production or Post-production.'}</p>`;

  <div class="slate">${cards}</div>`;
}

async function createPostProject(form){
  const val=n=>((form.querySelector('[name='+n+']')||{}).value||'').trim();
  const title=val('title'); if(!title){ toast('Give the project a title'); form.querySelector('[name=title]').focus(); return; }
  const id=slug(title)+'-'+Date.now().toString(36).slice(-4); const base='projects/'+id;
  const doc={kind:'post', title, client:val('client'), driveFolder:val('drive'), preRelease:val('pre'), referencesFolder:val('refs')||null, aspectRatio:form.elements.aspect.value, deliverableDurationSec:Number(val('duration'))||null, audioLed:form.elements.led.value==='audio', footageSource:form.elements.source.value, status:'intake', createdAt:now(), createdBy:me};
  // The bell rings first, on the press itself, as it does for a pre-production project.
  await signalPipeline('New post project opened: '+title+(doc.client?' for '+doc.client:'')+' ('+id+')', slateOrderFor(doc, id));
  if(!await write(base, doc)) return;
  for(const it of POST.ITEMS) await write(base+'/items/'+it.id, {status:'pending', version:0, summary:'', updatedAt:now(), updatedBy:me});
  await write(base+'/messages/'+Date.now().toString(36), {by:me, text:'Project opened from the slate. The run scaffolds the job from these answers and adopts this card.', at:now()});
  location.hash='#/p/'+encodeURIComponent(id);
}

/* ---------- post-production: music, generated shots, motion graphics ---------- */
async function chooseBgm(id){
  const c=bgm.find(x=>x.id===id); if(!c) return; const base='projects/'+project.id;
  for(const x of bgm){ const want=x.id===id; if(!!x.chosen!==want) await write(base+'/bgm/'+x.id, {...strip(x), chosen:want, chosenBy:want?me:null, chosenAt:want?now():null}); }
  await setItem('bgm',{status:'approved', approvedBy:me, approvedAt:now(), approvedVersion:itemOf('bgm').version||0, choice:id, choiceTitle:c.title||id}, `BGM chosen: ${c.title||id}${c.source?' ('+c.source+')':''}.`);
  await write(base+'/inbox/'+Date.now().toString(36),{type:'bgm-choice',item:'bgm',candidate:id,text:`BGM chosen: ${c.title||id}`,from:me,status:'answered',answer:id,answeredBy:me,answeredAt:now(),createdAt:now()});
  toast('BGM chosen: '+(c.title||id), 'ok'); await signalPipeline('BGM chosen: '+(c.title||id));
}
async function requestBroll(form){
  const shot=(form.querySelector('[name=shot]').value||'').trim(); if(!shot){ toast('Describe the shot'); form.querySelector('[name=shot]').focus(); return; }
  const durationSec=Number(form.querySelector('[name=duration]').value)||5; const aspect=form.querySelector('[name=aspect]').value||(project.aspectRatio||'16:9');
  const id='b-'+Date.now().toString(36);
  await write('projects/'+project.id+'/inbox/'+id,{type:'generate',item:'broll',shot,durationSec,aspect,text:`B-roll: ${shot} · ${durationSec}s · ${aspect}`,from:me,status:'requested',createdAt:now()});
  const it=itemOf('broll'); if(['pending','needs_input'].includes(it.status)) await setItem('broll',{status:'draft'});
  await log(`B-roll requested: ${shot} (${durationSec}s, ${aspect}). Waiting for the quote.`, 'broll');
  form.reset(); toast('Request sent; the pipeline quotes it before anything is spent', 'ok'); await signalPipeline('B-roll requested: '+shot.slice(0,60));
}
async function approveBroll(r){

}
async function declineBroll(r){

async function approveMograph(id){

  if(m.sample && rest) await write('projects/'+project.id+'/inbox/'+('g-'+Date.now().toString(36)),{type:'generate',item:'mograph',scope:'batch',text:`Render the motion-graphics batch: ${rest} alpha${rest===1?'':'s'} from the approved sample`,from:me,status:'open',approvedBy:me,approvedAt:now(),createdAt:now()});

/* ---------- the pipeline: stages down a spine, each gate across it ---------- */
const STAGE0 = {n:0, name:'Intake', sub:''};
const NODE = {approved:ic('check'), running:'<span class="pip"></span>', draft:'<span class="pip"></span>', needs_input:ic('q'), needs_review:ic('change'), blocked:ic('gate'), pending:'', na:''};
// What the step is holding beyond its summary: rows entered, references chosen, panels drawn.
function stepCount(it){
  if(KIND==='post'){
    if(it.id==='bgm') return bgm.length?`${bgm.length} candidate${bgm.length===1?'':'s'}${it.choiceTitle?', chosen: '+it.choiceTitle:''}`:'';
    if(it.id==='broll'){ const rs=brollReqs(); const q=rs.filter(r=>r.status==='quoted').length; return rs.length?`${rs.length} request${rs.length===1?'':'s'}${q?`, ${q} quoted`:''}`:''; }
    if(it.id==='mograph') return mograph.length?`${mograph.filter(m=>m.thumb).length} of ${mograph.length} rendered`:'';
    return '';
  }
  if(REG_FIELDS[it.id]) return regs[it.id].length?`${regs[it.id].length} row${regs[it.id].length===1?'':'s'}${regUnknowns(it.id)?`, ${regUnknowns(it.id)} with blanks`:''}`:'';
  if(it.id==='scraper'&&refs.length) return `${chosenCount()} of ${refs.length} chosen`;
  if(it.id==='storyboard'&&panels.length) return `${panels.filter(p=>p.thumb).length} of ${panels.length} drawn`;
  return '';
}
function stepRow(it, model){
  const why=model?null:blockedBy(it); const sh=model?'pending':shownStatus(it); const cls=why?'blocked':sh;
  const gl=gateOpen?(GATES[gateOpen].items.includes(it.id)?'hl':'dimmed'):'';
  const sel=!model&&agentOpen&&drawer===it.id?'sel':'';
  const sub=model?it.produces: why?'Waits on '+(why.gate?'Gate '+why.gate:why.deps.map(d=>itemOf(d).name).join(', ')): sh==='needs_review'&&it.changeNote?it.changeNote: it.status==='approved'&&it.approvedBy?`${it.summary||it.produces}`:(it.summary||it.produces);
  const cnt=model?'':stepCount(it);
  const quick=!model&&!['approved','na','pending','running'].includes(it.status)&&Number(it.version||0)>0;

// The chat is assembled from what the board already holds: an agent's runs are its messages, a

function questionMsgs(r, out){

function chatMsgs(seat){

    messages.filter(m=>!m.item).forEach(m=>{ const t=String(m.text||''); if(/^Answered: /.test(t)) return;
      if(isAgentSeat(m.by)&&m.by!=='orchestrator') return;

      else out.push({side:'me', at:m.at, who:humanName(m.by), html:`<p>${esc(t)}</p>${m.files&&m.files.length?fileChips(m.files):''}`}); });

function filesOf(it, v){
  const rec = v || (versions[it.id]||[]).find(x=>Number(x.n)===Number(it.version)) || null;
  const list = (rec&&rec.files) || it.files || [];

  const p = (rec&&(rec.path||rec.file)) || it.artifactPath || it.file;
  return p ? [{name:p.split('/').pop(), path:p}] : [];

function fullPath(it, f, v){

    if(f.id==='newp') return createProject(f);
    if(f.id==='newpost') return createPostProject(f);
    if(f.id==='brollf') return guarded('brollf', ()=>requestBroll(f));
    if(f.id==='msgf'){ if(attachBusy){ toast('Still uploading; send in a moment'); return; } const v=f.text.value.trim()||(attach.length?'See the attached file'+(attach.length>1?'s':''):''); if(!v) return; const fs=takeFiles(); f.reset(); await signalPipeline('Message from '+humanName(me)+': '+v.slice(0,80), 'Message on the board from '+humanName(me)+': '+v+'. Read it, act on it if it asks for something, and reply in chat.'+filesOrder(fs)); await log(v, null, fs); f.reset(); toast('Sent to the run', 'ok'); return; }
    if(f.dataset.reg) return addRow(f.dataset.reg, f);
    if(f.dataset.redoForm){ const v=f.text.value.trim(); if(!v) return; redoFor=null; await redoPanel(f.dataset.redoForm, v); return; }
    if(f.id==='changef'){ if(attachBusy){ toast('Still uploading; send in a moment'); return; } const v=f.text.value.trim(); if(!v) return; changeFor=null; await requestChange(f.dataset.item, v, takeFiles()); return; }
    if(f.dataset.answerForm){ const r=inbox.find(x=>x.id===f.dataset.answerForm); const v=f.text.value.trim(); if(r&&v){ await answer(r, v); } return; }
    if(f.id==='notef'){ if(attachBusy){ toast('Still uploading; send in a moment'); return; } const v=f.text.value.trim()||(attach.length?'See the attached file'+(attach.length>1?'s':''):''); if(!v||!project) return; const fs=takeFiles(); f.reset(); const id=f.dataset.item; const it=itemOf(id);
      await write('projects/'+project.id+'/inbox/'+Date.now().toString(36),{type:'change',item:id,text:v,from:me,status:'open',createdAt:now(), ...(fs.length?{files:fs}:{})});
      await log(`Note to ${seatLabel(it.seat)} on ${it.name} v${it.version||0}: ${v}`, id, fs); toast('Sent to '+seatLabel(it.seat), 'ok'); await signalPipeline('Note to '+seatLabel(it.seat)+' on '+it.name+': '+v.slice(0,80), fs.length?'Land the board (board-sync.js land) and carry on; reply here in one line, and put the same reply in the agent chat (board-say.js, then board-sync.js push).'+filesOrder(fs):undefined); return; }
  };
  const sel=$('#me'); if(sel) sel.onchange=()=>{ me=sel.value; try{localStorage.setItem('c122.me',me);}catch(e){} render(); };
  // Enter sends a chat message; Shift+Enter starts a new line.
  app.onkeydown = e=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.matches&&e.target.matches('.composer textarea')){ e.preventDefault(); e.target.form.requestSubmit(); } };
  // Files: dropped anywhere on the open chat, pasted into its box, or picked with the paperclip.
  const overChat=e=>e.target&&e.target.closest?e.target.closest('.chat'):null;
  app.ondragover = e=>{ const c=overChat(e); if(!c||!e.dataTransfer||![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); c.classList.add('drop'); };
  app.ondragleave = e=>{ const c=overChat(e); if(c&&!c.contains(e.relatedTarget)) c.classList.remove('drop'); };
  app.ondrop = e=>{ const c=overChat(e); if(!c||!e.dataTransfer||!e.dataTransfer.files.length) return; e.preventDefault(); c.classList.remove('drop'); chatJump=true; addFiles(e.dataTransfer.files); };
  app.onpaste = e=>{ if(e.target.matches&&e.target.matches('.composer textarea')&&e.clipboardData&&e.clipboardData.files.length){ e.preventDefault(); addFiles(e.clipboardData.files); } };
  const fin=$('#attach-in'); if(fin) fin.onchange=()=>{ const fl=[...fin.files]; fin.value=''; addFiles(fl); };
  const rsel=$('#runsel'); if(rsel) rsel.onchange=()=>{ runSel=rsel.value; render(); };
}
boot();
</script>
