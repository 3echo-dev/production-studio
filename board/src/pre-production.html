// The questions the run is waiting on, above the pipeline, each with its options and a text
// box; one press answers and rings the bell. With nothing waiting the box is not drawn at all.
function pendingHtml(){
  const open=inbox.filter(r=>r.type==='question'&&['open','waiting'].includes(r.status));
  const others=inbox.filter(r=>r.type!=='question'&&['open','waiting','requested','quoted'].includes(r.status));
  if(!open.length&&!others.length) return '';
  const q=open.map(r=>{
    const opts=(r.options||[]).map((o,i)=>`<button data-answer="${esc(r.id)}" data-value="${esc(o)}" class="${i===0?'first':''}">${esc(o)}</button>`).join('');
    const tail = r.status==='waiting' ? `<div class="qa">Picked up by the run · waiting on: ${esc(r.waitingText||'this answer')}</div>` : '';
    const thumb = r.thumb&&/^data:image\/(png|jpe?g|webp);base64,/.test(r.thumb)?`<div class="qthumb"><img src="${esc(r.thumb)}" alt="${esc(r.text)}"></div>`:'';
    return `<div class="pq ${r.status==='waiting'?'waiting':''}"><span class="ag-f">${blob(r.from, 'surprised', 32)}</span><div class="pq-b"><div class="qm"><b>${esc(whoName(r.from))}</b><span>${r.item?esc(itemOf(r.item).name):'Project'}</span><span>${fmt(r.createdAt)}</span></div><div class="bub"><p class="qt">${esc(r.text)}</p>${thumb}${opts?`<div class="bub-act">${opts}</div>`:''}</div><form class="qf cmp-row" data-answer-form="${esc(r.id)}"><input name="text" id="ans-${esc(r.id)}" aria-label="Your answer" placeholder="${opts?'Or type a different answer':'Type your answer'}"><button type="submit" class="primary icon" aria-label="Send answer" title="Send answer">${ic('send')}</button></form>${tail}</div></div>`;
  }).join('');
  const pend = others.length ? `<div class="hist" ${open.length?'':'style="border:0;padding:0"'}>${others.map(r=>`<div><b>${esc(r.type==='generate'?'Drawing':r.type==='export'?'Exporting':r.type==='change'?'Change sent':r.type)}</b> · ${esc(r.text)}${r.status==='waiting'?' · waiting on '+esc(r.waitingText||'a question'):r.status==='quoted'?' · quoted '+esc(r.credits||'?')+' credits':''}</div>`).join('')}</div>` : '';
  return `<section class="needs ${open.length?'':'quiet'}" id="pending" aria-label="${open.length?'Needs you':'In hand'}"><div class="ph"><h2>${open.length?`Needs you <span class="n">${open.length}</span>`:'In hand'}</h2><span class="meta">${open.length?'The run is waiting on you; one press answers and wakes it.':'Picked up by the run; nothing for you to do.'}</span></div>${q}${pend}</section>`;

/* ---------- the agent inbox, and the open agent's chat ---------- */
function agentRow(s, a, seen){
  const un=unseen(s.id, a.at, seen)&&a.st!=='idle';
  const badge=a.q?`<span class="n" title="Questions waiting on you">${a.q}</span>`:un?'<i class="dot" role="img" aria-label="New" title="New since you last looked"></i>':'';
  return `<button class="ag st-${a.st}" data-agent="${s.id}">
    <span class="ag-f">${blob(s.id, AGENT_MOOD[a.st], 36)}<i class="ag-d" aria-hidden="true"></i></span>
    <span class="ag-b"><span class="ag-n"><b>${esc(s.label)}</b>${a.at?`<span class="ag-time num" title="${esc(fmt(a.at))}">${ago(a.at)}</span>`:''}</span><span class="ag-l"><span class="ag-w">${esc(a.word)}</span>${a.line?' · '+esc(a.line):''}</span></span>
    <span class="ag-t">${badge}</span>
  </button>`;
}
function inboxHtml(){
  const seen=seenMap(); if(project&&!seen[project.id]){ seen[project.id]={_first:now()}; try{ localStorage.setItem('c122.seen', JSON.stringify(seen)); }catch(e){} }
  const all=agentsInScope().map(s=>({s, a:agentState(s.id)}));
  const rank={working:0,ask:1,review:2,draft:3,done:4};
  const orch=all.filter(x=>x.s.id==='orchestrator');
  const called=all.filter(x=>x.s.id!=='orchestrator'&&x.a.st!=='idle').sort((x,y)=>rank[x.a.st]-rank[y.a.st]||String(y.a.at||'').localeCompare(String(x.a.at||'')));
  const quiet=all.filter(x=>x.s.id!=='orchestrator'&&x.a.st==='idle');
  const working=all.filter(x=>x.a.st==='working').length, ask=all.filter(x=>x.a.st==='ask'||x.a.st==='draft').length;
  const sum=[working?working+' working':'', ask?ask+' waiting on you':''].filter(Boolean).join(' · ')||all.length+' on this pipeline';
  return `<section class="inbox" aria-label="Agent inbox"><div class="in-h"><h2>Inbox</h2><span class="meta num">${sum}</span></div>
    <div class="in-l" data-scroll="inbox">${orch.concat(called).map(x=>agentRow(x.s,x.a,seen)).join('')}${quiet.length?`<div class="in-sep">Not called yet</div>${quiet.map(x=>agentRow(x.s,x.a,seen)).join('')}`:''}</div>
  </section>`;
}
// The chat is assembled from what the board already holds: an agent's runs are its messages, a
// question it asked is a message with the options as replies, and what a person answered, noted
// or asked to change is their message back. Nothing is stored for the chat itself.
function isHuman(id){ const k=LEGACY_IDS[id]||id; return HUMANS.some(h=>h.id===k); }
function safeImg(u){ return /^(data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+\/=]+|https:\/\/[^\s"'()<>\\]+)$/i.test(String(u||'')); }
function questionMsgs(r, out){
  const open=r.status==='open';
  const opts=open?(r.options||[]).map(o=>`<button class="sm" data-answer="${esc(r.id)}" data-value="${esc(o)}">${esc(o)}</button>`).join(''):'';
  out.push({side:'a', at:r.createdAt, who:whoName(r.from), html:`<p>${esc(r.text)}</p>${r.thumb&&safeImg(r.thumb)?`<img class="bub-img" src="${esc(r.thumb)}" alt="">`:''}${open?`<div class="bub-act">${opts}<button class="sm ghost" data-goto-pending>${ic('q')} Type an answer</button></div>`:r.status==='waiting'?`<p class="bub-note">Picked up by the run · waiting on ${esc(r.waitingText||'this answer')}</p>`:''}`});
  if(r.status==='answered') out.push({side:'me', at:r.answeredAt||r.createdAt, who:humanName(r.answeredBy), html:`<p>${esc(r.answer||'')}</p>`});
}
function logMsgs(m, out){
  const t=String(m.text||''); if(/^Answered: /.test(t)) return;
  if(!isHuman(m.by)){ out.push({side:'sys', at:m.at, html:esc(t)}); return; }
  const note=t.match(/^Note to .+? on .+? v\d+: ([\s\S]*)$/), chg=t.match(/^Change requested on [^:]+: ([\s\S]*)$/);
  const fl=m.files&&m.files.length?fileChips(m.files):'';
  if(note) out.push({side:'me', at:m.at, who:humanName(m.by), html:`<p>${esc(note[1])}</p>${fl}`});
  else if(chg) out.push({side:'me', at:m.at, who:humanName(m.by), html:`<span class="bub-tag">${ic('change')} Change request</span><p>${esc(chg[1])}</p>${fl}`});
  else out.push({side:'sys', at:m.at, html:`${esc(humanName(m.by))} · ${esc(t)}`});
}
function runBubble(it, r){
  const meta=[r.model, r.turns!=null?r.turns+' turns':'', r.tokens!=null?tok(r.tokens)+' tokens':''].filter(Boolean).join(' · ');
  const long=String(r.output||'').length>280;
  return `<div class="bub-h"><b>${esc(it.name)}</b>${r.version!=null?`<span class="v num">v${esc(r.version)}</span>`:''}</div>${r.output?`<div class="bub-out ${long?'clip':''}">${md(r.output)}</div>`:`<p class="bub-note">Wrote its file to disk: ${esc(r.artifactPath||it.artifactPath||'')}</p>`}<div class="bub-f"><span class="num">${esc(meta)}</span><button class="ghost sm" data-open-run="${esc(it.id)}" data-run="${esc(r.id)}">${ic('open')} Open</button></div>`;
}
function chatMsgs(seat){
  const out=[];
  if(seat.id==='orchestrator'){

    if(t.dataset.demo!=null){ startDemo(); return; }
    if(t.dataset.wider){ e.preventDefault(); await guarded('wider', ()=>searchWider(t.dataset.wider)); return; }
    if(t.dataset.dl){ await guarded('dl'+t.dataset.dl, ()=>downloadExport(t.dataset.dl)); return; }
    if(t.dataset.dlCsv){ await downloadCsv(t.dataset.dlCsv); return; }
    if(t.dataset.home!=null){ e.preventDefault(); closePanel(); refocus=null; gateOpen=null; location.hash='#/'; return; }
    if(t.dataset.copyPath!=null){ try { await navigator.clipboard.writeText(t.dataset.copyPath); toast(t.dataset.copyPath.includes('\n')?'Paths copied':'Path copied', 'ok'); } catch { toast('Could not copy. Select the path and copy it by hand.'); } return; }
    if(t.dataset.gate){ gateOpen = gateOpen===t.dataset.gate ? null : t.dataset.gate; gateEnter=true; render(); const d=document.querySelector('[data-gate-detail]'); if(d) d.scrollIntoView({block:'nearest',behavior:'smooth'}); return; }
    if(t.dataset.open!=null){ location.hash='#/p/'+encodeURIComponent(t.dataset.open); return; }
    if(t.dataset.attach!=null){ const fin=document.getElementById('attach-in'); if(fin) fin.click(); return; }
    if(t.dataset.unattach!=null){ const f=attach.splice(Number(t.dataset.unattach),1)[0]; render(); if(f&&f.asset){ try{ const st=await claude.use('assets'); if(st) await st.delete(f.asset); }catch(e){} } return; }
    if(t.dataset.sheetClose!=null){ sheetOpen=false; render(); return; }
    if(t.dataset.sheetOpen!=null){ sheetOpen=true; sheetEnter=true; render(); return; }
    if(t.dataset.agentClose!=null){ closePanel(); render(); return; }
    if(t.dataset.wide!=null){ panelWide=!panelWide; try{ localStorage.setItem('c122.wide', panelWide?'1':'0'); }catch(e){} render(); return; }
    if(t.dataset.agent){ openAgent(t.dataset.agent); render(); return; }
    if(t.dataset.gotoPending!=null){ if(agentOpen&&matchMedia('(max-width:960px)').matches){ closePanel(); refocus=null; render(); } const p=document.getElementById('pending'); if(p){ p.scrollIntoView({block:'start',behavior:'smooth'}); const i=p.querySelector('button,input'); if(i) i.focus({preventScroll:true}); } return; }
    if(t.dataset.lightboxClose!=null){ lightbox=null; render(); return; }
    if(t.dataset.lightbox){ lightbox=t.dataset.lightbox; render(); return; }
    // A step on the pipeline opens its agent's chat; a message's Open button (it names a tab) opens the work sheet.
    if(t.dataset.openItem){ const was=sheetOpen; openItem(t.dataset.openItem, t.dataset.openTab); sheetOpen=was||!!t.dataset.openTab; sheetEnter=sheetOpen&&!was; changeFor=null; render(); return; }
    if(t.dataset.copySheet){ await copySheet(t.dataset.copySheet); return; }
    if(t.dataset.openRun){ const was=sheetOpen; openItem(t.dataset.openRun, 'output'); runSel=t.dataset.run||null; sheetOpen=true; sheetEnter=!was; render(); return; }
    if(t.dataset.tab){ drawerTab=t.dataset.tab; render(); return; }
    if(t.dataset.copy!=null){ await copyForChat(); return; }
    if(t.dataset.signal!=null){ await signalPipeline('Signal sent'); return; }
    if(!project) return;
    if(t.dataset.approve){ await guarded('ap'+t.dataset.approve, ()=>approve(t.dataset.approve)); return; }
    if(t.dataset.changeCancel!=null){ changeFor=null; render(); return; }
    if(t.dataset.change){ openItem(t.dataset.change, 'output'); sheetOpen=false; changeFor=t.dataset.change; panelFocus=false; render(); const ta=document.getElementById('change-'+t.dataset.change); if(ta) ta.focus(); return; }
    if(t.dataset.na){ const k='na'+t.dataset.na; if(!isArmed(k)){ arm(k); toast('Press again to confirm: not applicable is a decision, not a blank'); return; } armed=null; await markNA(t.dataset.na); return; }
    if(t.dataset.lock){ const g=t.dataset.lock, k='lock'+g; if(!isArmed(k)){ arm(k); toast('Press again to confirm the sign-off. The pipeline continues from this record.'); return; } armed=null; await guarded(k, ()=>lockGate(g)); return; }
    if(t.dataset.export){ await guarded('x'+t.dataset.export, ()=>requestExport(t.dataset.export)); return; }
    if(t.dataset.gen){ const k='gen-'+t.dataset.gen; if(!isArmed(k)){ arm(k); toast('Press again to confirm. Credits are spent on 3echo.'); return; } armed=null; await guarded(k, ()=>requestGenerate(t.dataset.gen)); return; }
    if(t.dataset.approvePanel){ await guarded('pp'+t.dataset.approvePanel, ()=>approvePanel(t.dataset.approvePanel)); return; }
    if(t.dataset.refToggle){ await guarded('rf'+t.dataset.refToggle, ()=>toggleRef(t.dataset.refToggle)); return; }
    if(t.dataset.redoCancel!=null){ redoFor=null; render(); return; }
    if(t.dataset.redo){ redoFor = redoFor===t.dataset.redo ? null : t.dataset.redo; render(); const ta=document.getElementById('redo-'+t.dataset.redo); if(ta) ta.focus(); return; }
    if(t.dataset.answer){ const r=inbox.find(x=>x.id===t.dataset.answer); if(r) await answer(r, t.dataset.value); return; }
  };
  app.onsubmit = async e=>{
    e.preventDefault(); const f=e.target; if(f.classList.contains('composer')) chatJump=true;
    if(f.id==='newp') return createProject(f);
    if(f.id==='msgf'){ if(attachBusy){ toast('Still uploading; send in a moment'); return; } const v=f.text.value.trim()||(attach.length?'See the attached file'+(attach.length>1?'s':''):''); if(!v) return; const fs=takeFiles(); f.reset(); await signalPipeline('Message from '+humanName(me)+': '+v.slice(0,80), 'Message on the board from '+humanName(me)+': '+v+'. Read it, act on it if it asks for something, and reply in chat.'+filesOrder(fs)); await log(v, null, fs); f.reset(); toast('Sent to the run', 'ok'); return; }
    if(f.dataset.reg) return addRow(f.dataset.reg, f);
    if(f.dataset.redoForm){ const v=f.text.value.trim(); if(!v) return; redoFor=null; await redoPanel(f.dataset.redoForm, v); return; }
    if(f.id==='changef'){ if(attachBusy){ toast('Still uploading; send in a moment'); return; } const v=f.text.value.trim(); if(!v) return; changeFor=null; await requestChange(f.dataset.item, v, takeFiles()); return; }
    if(f.dataset.answerForm){ const r=inbox.find(x=>x.id===f.dataset.answerForm); const v=f.text.value.trim(); if(r&&v){ await answer(r, v); } return; }
    if(f.id==='notef'){ if(attachBusy){ toast('Still uploading; send in a moment'); return; } const v=f.text.value.trim()||(attach.length?'See the attached file'+(attach.length>1?'s':''):''); if(!v||!project) return; const fs=takeFiles(); f.reset(); const id=f.dataset.item; const it=itemOf(id);
      await write('projects/'+project.id+'/inbox/'+Date.now().toString(36),{type:'change',item:id,text:v,from:me,status:'open',createdAt:now(), ...(fs.length?{files:fs}:{})});
      await log(`Note to ${seatLabel(it.seat)} on ${it.name} v${it.version||0}: ${v}`, id, fs); toast('Sent to '+seatLabel(it.seat), 'ok'); await signalPipeline('Note to '+seatLabel(it.seat)+' on '+it.name+': '+v.slice(0,80), fs.length?'Land the board (board-sync.js land) and carry on; reply here in one line.'+filesOrder(fs):undefined); return; }
  };
  const sel=$('#me'); if(sel) sel.onchange=()=>{ me=sel.value; try{localStorage.setItem('c122.me',me);}catch(e){} render(); };
  // Enter sends a chat message; Shift+Enter starts a new line.
  app.onkeydown = e=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.matches&&e.target.matches('.composer textarea')){ e.preventDefault(); e.target.form.requestSubmit(); } };
  // Files: dropped anywhere on the open chat, pasted into its box, or picked with the paperclip.
  const overChat=e=>e.target&&e.target.closest?e.target.closest('.chat'):null;
  app.ondragover = e=>{ const c=overChat(e); if(!c||!e.dataTransfer||![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); c.classList.add('drop'); };
  app.ondragleave = e=>{ const c=overChat(e); if(c&&!c.contains(e.relatedTarget)) c.classList.remove('drop'); };
  app.ondrop = e=>{ const c=overChat(e); if(!c||!e.dataTransfer||!e.dataTransfer.files.length) return; e.preventDefault(); c.classList.remove('drop'); chatJump=true; addFiles(e.dataTransfer.files); };
  app.onpaste = e=>{ if(e.target.matches&&e.target.matches('.composer textarea')&&e.clipboardData&&e.clipboardData.files.length){ e.preventDefault(); addFiles(e.clipboardData.files); } };
  const fin=$('#attach-in'); if(fin) fin.onchange=()=>{ const fl=[...fin.files]; fin.value=''; addFiles(fl); };
  const rsel=$('#runsel'); if(rsel) rsel.onchange=()=>{ runSel=rsel.value; render(); };
}
boot();
</script>
