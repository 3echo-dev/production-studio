async function lockGate(g){
  if(!gateReady(g)) return; const base='projects/'+project.id;
  // A post-production sign-off also carries each file and its hash as the pipeline last pushed them, so the run can bind the approval to the files on disk.
  const stamp={status:'passed', decidedBy:me, decidedAt:now(), ...(KIND==='post'?{round:((gates[g]&&gates[g].round)||0)+1}:{}), items:Object.fromEntries(gateItems(g).map(id=>{ const it=itemOf(id); return [id, KIND==='post'?{status:it.status,version:it.version||0,file:it.file||null,sha256:it.sha256||null,bytes:it.bytes||null}:{status:it.status,version:it.version||0}]; }))};
  await write(base+'/gates/'+g, stamp);
  const nextStatus = PIPE.gateNext[g]||'released';
  await write(base, {...project, status: nextStatus, updatedAt: now()});
  await write(base+'/inbox/'+Date.now().toString(36),{type:'gate',gate:g,text:`Gate ${g} ${GATES[g].name} passed by ${humanName(me)}`,from:me,status:'open',createdAt:now()});
  await log(`Gate ${g} signed off: ${GATES[g].name}.`);
  await signalPipeline(`Gate ${g} signed off`);
}
// How the page rings the bell. A republish delivers a new version to a watching session but
// starts no turn, so on the first test run three decisions sat unread until a person landed
// them by hand. A comment sent to Claude does start a turn in the sessions watching this
// artifact, so that is tried first, from the viewer's own gesture (the sign-off, the request, the
// answer, an approval, a change, a redo: every decision a person makes here); the republish stays as the fallback, and the page holds its own pristine source
// (base64) so it can republish itself with a fresh copy embedded.
function pristineSource(){ const el=document.getElementById('__src'); if(!el) return null; try{ const bin=atob(el.textContent.trim()); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }catch(e){ return null; } }
function embedSource(src){ const bytes=new TextEncoder().encode(src); let bin=''; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]); return '<script type="text/plain" id="__src">'+btoa(bin)+'</scr'+'ipt>'; }
function buildDocument(src){ const cut=src.indexOf('<svg width="0"'); const head=cut>0?src.slice(0,cut):''; const body=cut>0?src.slice(cut):src; return '<!doctype html>'+String.fromCharCode(10)+'<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'+head+'</head><body>'+body+String.fromCharCode(10)+embedSource(src)+String.fromCharCode(10)+'</body></html>'; }
// Every outcome of the bell is written to meta/bell on the board database, so a press that
// seemed to do nothing can be read back afterwards (ArtifactData get meta bell).
async function bellLog(why, outcome, detail){ if(!db) return; const rec={at:now(), why, outcome, detail:detail==null?null:String(detail).slice(0,600), by:me, project:project&&project.id||null}; try{ await db.doc('bells/'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)).set(rec); }catch(e){} try{ await db.doc('meta/bell').set(rec); }catch(e){} }
// The slate form's project has a board id and no folder: the bell carries the order to start it,
// so the woken turn runs new-project with the fields as answers instead of asking.
function slateOrderFor(d, id){ return kindOf(d)==='post'?slateOrderPost(d, id):slateOrderPre(d, id); }
function slateOrderPost(d, id){ return 'This is a slate project with no job folder yet'+(id?', slate id '+id:'')+'. Run the new-post-project skill for it now, in this turn, with these answers already given: client '+(d.client||'not given, ask for it')+', title '+(d.title||'')+', footage folder '+(d.driveFolder||'not given, ask for it')+', pre-prod release folder '+(d.preRelease||'not given, ask for it')+', aspect ratio '+(d.aspectRatio||'not given')+', duration '+(d.deliverableDurationSec?d.deliverableDurationSec+' s':'not given, ask for it')+', '+(d.audioLed?'voice-over leads the cut (audioLed true)':'picture leads the cut (audioLed false)')+', references folder '+(d.referencesFolder||'the references/ folder inside the footage folder, if there is one')+', footage '+(d.footageSource==='hybrid'?'hybrid: real actors kept as shot, backgrounds replaced (footageSource hybrid; actor plates under the footage/plates folder, one per panel)':d.footageSource==='generated'?'generated per storyboard panel (footageSource generated; the footage folder is where the clips land)':'shot rushes (footageSource shoot)')+'. Ask nothing these answer. Scaffold the client if it does not exist, scaffold the job, write these into job.json, route, plan, run scan-references.js and put its summary on the Intake item (ask only about what must be drawn from text), board-sync.js open and push; when the job id exists run board-sync.js adopt with --from the slate id, push, and carry on to Gate A. Do not reply asking whether to start.'; }
function slateOrderPre(d, id){ return 'This is a slate project with no job folder yet'+(id?', slate id '+id:'')+'. Run the new-project skill for it now, in this turn, with these answers already given: client '+(d.client||'not given')+', folder '+(d.driveFolder||'not given, ask for it')+', title '+(d.title||'')+', script format '+(d.scriptFormat||'')+', storyboard style '+(d.storyboardStyle||'')+'. Ask nothing these answer. When the job id exists run board-sync.js adopt with --from the slate id, push, and carry on to Gate A. Do not reply asking whether to start.'; }
// What the bell says for a note written in an agent's chat: the whole message, which agent and step it was about, and where the reply belongs.
function noteOrder(it, v, fs){ const so=slateOrder(); return (so?so+' ':'')+humanName(me)+' wrote to '+seatLabel(it.seat)+' in its chat about '+it.name+(it.status==='pending'?' (not started yet)':'')+': "'+v+'". Land the board (board-sync.js land), read it, act on it if it asks for something, then reply in that same chat in one line: board-say.js {job} --as '+it.seat+' --item '+it.id+' "...", then board-sync.js push.'+filesOrder(fs); }
function slateOrder(){ return project&&project.createdBy&&project.createdBy!=='pipeline'&&project.status!=='moved'&&project.driveFolder!=null ? slateOrderFor(project, project.id) : null; }
// Consent is per board and per viewer; asking for it here, on the person's own press, holds the
// dialog open instead of letting the first send fail with consent_required and fall back.
async function consentForComments(why){ let pm=null; try{ pm=await claude.use('permissions'); }catch(e){ pm=null; } if(!pm){ await bellLog(why,'permissions','no permissions capability'); return true; } let before='?'; try{ before=JSON.stringify(await pm.state()); }catch(e){ before='state failed: '+(e&&e.message||e); } let res=null, st='granted'; try{ res=await pm.request(['comments']); st=(res&&res.comments)||'granted'; }catch(e){ st='granted'; res='request failed: '+(e&&e.message||e); } await bellLog(why,'permissions', before+' -> '+(typeof res==='string'?res:JSON.stringify(res))); if(st==='denied'){ await bellLog(why,'consent_denied'); toast(why+'. Consent declined; say it in chat.'); return false; } return true; }
async function signalPipeline(why, order){
  if(dbState==='demo'){ toast(why+'. Example board: nothing is sent.', 'ok'); return false; }
  const what=why+(project&&project.title?' on '+project.title:'')+(project&&project.id?' ('+project.id+')':'');
  let cm=null; try{ cm=await claude.use('comments'); }catch(e){ cm=null; }
  if(cm){
    let can='off'; try{ can=await cm.canSendToClaude(); }catch(e){ can='off'; }
    if(can==='available' && await consentForComments(why)){
      try{
        const el=document.querySelector('[data-signal-anchor]')||document.body.firstElementChild||document.body;
        const anchor=await cm.anchorFor(el);
        await cm.sendToClaude({anchor, text:PIPE.label+' board: '+what+'. '+(order||slateOrder()||'Land the board (board-sync.js land) and carry on; reply here in one line, and put the same reply in the agent chat (board-say.js, then board-sync.js push).')});
        await bellLog(why,'sent'); told={at:Date.now(), why}; setTimeout(queue, TOLD_MS+500); toast(why+'. The run has been told.', 'ok'); return true;
      }catch(e){ await bellLog(why,'send_failed',(e&&(e.code+' '+e.message))||e); if(e&&e.code==='consent_required') toast(why+'. Allow this page to send comments to Claude, or the run has to be told in chat.'); }
    } else if(can==='no_session'){ await bellLog(why,'no_session'); toast(why+'. No run is watching the board right now; say it in chat when one is.'); }
    else if(can==='writers_only'){ await bellLog(why,'writers_only'); toast(why+'. Only an editor of the board can send it to the run; say it in chat.'); }
    else if(can!=='available'){ await bellLog(why,'not_available',can); }
  } else { await bellLog(why,'no_comments_capability');
  }
  let art=null; try{ art=await claude.use('artifact'); }catch(e){ art=null; }
  const src=pristineSource();
  if(!art||!src){ toast(why+'. The pipeline will see it on its next check.'); return false; }
  try{ await art.publish(buildDocument(src)); await bellLog(why,'republished'); toast(why+'. The pipeline has been signalled.', 'ok'); return true; }
  catch(e){ await bellLog(why,'republish_failed',(e&&e.code)||e); toast(why+'. Signal not sent ('+((e&&e.code)||'error')+'); the pipeline will see it on its next check.'); return false; }
}

const AGENT_MOOD = {working:'thinking', ask:'surprised', review:'sad', draft:'idle', done:'happy', idle:'sleepy'};
const AGENT_PILL = {working:'running', ask:'needs_input', review:'needs_review', draft:'draft', done:'approved', idle:'pending'};
// What a row says: the state of the seat's steps, the step it is on, and its last delivery.
const TOLD_MS = 10*60*1000;
// The bell rang; nothing the run would write (a run record, an agent reply, a heartbeat, a project update) has arrived since.
function toldLive(){
  if(!told) return null; if(Date.now()-told.at>TOLD_MS){ told=null; return null; }
  const since=t=>!!t&&Date.parse(t)>told.at-2000;
  const alive=Object.values(runs).some(rs=>rs.some(r=>since(r.startedAt)||since(r.finishedAt)))||messages.some(m=>isAgentSeat(m.by)&&since(m.at))||(project&&(since(project.heartbeatAt)||since(project.updatedAt)));

}
function agentState(seat){

    if(t&&!act) return {st:'working', word:'Told, waiting for the run', line:'The run has been told: '+t.why+'. It shows here as soon as it starts; if nothing comes, say it in the chat of the session that watches the board.', at:new Date(t.at).toISOString(), item:null, q:0};

  let st='idle', word=its.some(i=>blockedBy(i))?'Waiting its turn':'Not called yet';
  if(sh.includes('running')||(r&&r.status==='running')){ st='working'; word='Working'; }
  else if(q||sh.includes('needs_input')){ st='ask'; word='Needs you'; }
  else if(sh.includes('needs_review')){ st='review'; word='Change requested'; }
  else if(sh.includes('draft')){ st='draft'; word='Ready for review'; }
  else if(its.length&&sh.every(s=>s==='approved'||s==='na')){ st='done'; word='Done'; }
  const latest=its.slice().sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))[0];
  const cur=its.find(i=>shownStatus(i)==='running')||its.find(i=>['needs_input','needs_review','draft'].includes(shownStatus(i)))||latest;
  const line=cur?(cur.status==='pending'?cur.produces:`${cur.name} v${cur.version||0}: ${cur.summary||cur.produces}`):'';
  let at=st==='idle'?null:((r&&(r.finishedAt||r.startedAt))||(latest&&latest.updatedAt)||null);

  const say=messages.find(m=>isAgentSeat(m.by)&&(m.by===seat||its.some(i=>i.id===m.item)));

}

// The same calls the page makes on the real database, held in memory, so every button on the
// example works and nothing is saved or sent.
function demoDb(){
  const docs=new Map(), subs=new Set();
  const parent=p=>p.slice(0,p.lastIndexOf('/')), idOf=p=>p.slice(p.lastIndexOf('/')+1);
  const fire=()=>[...subs].forEach(f=>f());
  const snap=p=>({exists:docs.has(p), id:idOf(p), data:()=>({...docs.get(p)})});
  const doc=p=>({
    set:async d=>{ docs.set(p,{...d}); fire(); },
    update:async d=>{ docs.set(p,{...(docs.get(p)||{}),...d}); fire(); },
    get:async()=>snap(p),
    onSnapshot:cb=>{ const f=()=>cb(snap(p)); subs.add(f); f(); return ()=>subs.delete(f); },
  });
  const collection=p=>{ let ord=null, lim=0; const q={
    orderBy:(f,d)=>{ ord=[f,d]; return q; }, limit:n=>{ lim=n; return q; },
    onSnapshot:cb=>{ const f=()=>{ let rows=[...docs.keys()].filter(k=>parent(k)===p).map(snap); if(ord) rows.sort((a,b)=>String(a.data()[ord[0]]||'').localeCompare(String(b.data()[ord[0]]||''))*(ord[1]==='desc'?-1:1)); if(lim) rows=rows.slice(0,lim); cb({docs:rows}); }; subs.add(f); f(); return ()=>subs.delete(f); },
  }; return q; };
  return {doc, collection, seed:(p,d)=>docs.set(p,d)};
}

// Every database change redraws the page. What a person was in the middle of survives it:
// typed text, the focused control, scroll positions and which sections were open.
function keyOf(el){ if(el.id) return '#'+CSS.escape(el.id); const d=Object.entries(el.dataset||{}); if(!d.length) return null; return el.tagName.toLowerCase()+d.map(([k,v])=>'[data-'+k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())+'="'+CSS.escape(v)+'"]').join(''); }
function keep(app){
  const s={vals:[],radio:[],scroll:[],det:[],focus:null,sel:null};
  app.querySelectorAll('input[id],textarea[id]').forEach(el=>{ if(el.type!=='radio'&&el.type!=='checkbox'&&el.value) s.vals.push([el.id,el.value]); });
  app.querySelectorAll('input[type=radio]:checked').forEach(el=>s.radio.push([el.name,el.value]));
  app.querySelectorAll('[data-scroll]').forEach(el=>s.scroll.push([el.dataset.scroll,el.scrollTop,el.scrollLeft]));
  app.querySelectorAll('details[data-k]').forEach(el=>s.det.push([el.dataset.k,el.open]));
  const a=document.activeElement; if(a&&a!==document.body&&app.contains(a)){ s.focus=keyOf(a); try{ s.sel=[a.selectionStart,a.selectionEnd]; }catch(e){} }
  return s;
}
function restore(app, s){
  for(const [id,v] of s.vals){ const el=document.getElementById(id); if(el&&!el.value) el.value=v; }
  for(const [n,v] of s.radio){ const el=app.querySelector('input[type=radio][name="'+n+'"][value="'+CSS.escape(v)+'"]'); if(el) el.checked=true; }
  for(const [k,o] of s.det){ const el=app.querySelector('details[data-k="'+CSS.escape(k)+'"]'); if(el) el.open=o; }
  for(const [k,t,l] of s.scroll){ const el=app.querySelector('[data-scroll="'+CSS.escape(k)+'"]'); if(el){ el.scrollTop=t; el.scrollLeft=l; } }
  let el=null;
  if(refocus){ el=app.querySelector(refocus); }
  else if(panelFocus){ el=document.getElementById('th-title'); }
  else if(s.focus){ try{ el=app.querySelector(s.focus); }catch(e){ el=null; } }
  if(el){ el.focus({preventScroll:true}); if(!refocus&&!panelFocus&&s.sel&&s.sel[0]!=null){ try{ el.setSelectionRange(s.sel[0],s.sel[1]); }catch(e){} } }
}
let rq=0;
function queue(){ if(rq) return; rq=requestAnimationFrame(()=>{ rq=0; render(); }); }
function render(){
  const r=route(); const app=$('#app');
  usePipe(r.page==='slate'?r.kind: r.page==='project'?projectKind():KIND);
  try{
    const kept=keep(app); const c0=app.querySelector('.chat-l'); const stick=!!c0&&c0.scrollHeight-c0.scrollTop-c0.clientHeight<32;
    app.innerHTML = topbar() + (r.page==='project' ? projectPage(r.id)+workSheetHtml() : r.page==='slate' ? slatePage() : homePage()) + footer() + lightboxHtml();
    wire(); restore(app, kept);
    const c1=app.querySelector('.chat-l'); if(c1&&(chatJump||stick)) c1.scrollTop=c1.scrollHeight;
    if(sheetEnter){ const b=app.querySelector('.ws-h button'); if(b) b.focus({preventScroll:true}); }
  }catch(e){
    // An error here used to leave the page blank. It is shown instead, with a way back.
    app.innerHTML = `<div style="padding:24px;max-width:720px"><h2 style="font-size:20px">The board hit an error while drawing</h2><p class="meta" style="margin:8px 0 10px">Copy this into the chat so it can be fixed. Reloading usually clears it.</p><pre class="pre">${esc((e&&e.stack)||e)}</pre><div style="display:flex;gap:8px;margin-top:10px"><button class="primary" data-reload>Reload the board</button></div></div>`;
    app.onclick = ev=>{ const t=ev.target.closest('[data-reload]'); if(t) location.reload(); };
  }
  panelEnter=false; panelFocus=false; gateEnter=false; refocus=null; sheetEnter=false; chatJump=false;
}

function topbar(){
  const rt=route(); const back=rt.page==='project'?`<button class="ghost" data-nav="#/${KIND}" title="Back to every ${esc(PIPE.label.toLowerCase())} project">${ic('back')} ${esc(PIPE.label)}</button>`: rt.page==='slate'?`<button class="ghost" data-nav="#/" title="Back to the studio">${ic('back')} Studio</button>`:'';
  const conn=dbState==='on'?'Board connected':dbState==='connecting'?'Connecting to the board…':dbState==='demo'?'Example board, nothing is saved or sent':'Not connected';
  return `<header class="top">
    <div class="brand">${back}<a href="#/" data-home><img src="${LOGO}" alt="3echo"><span class="sep" aria-hidden="true"></span><h1>${rt.page==='home'?'Production Studio':esc(PIPE.label)}</h1></a></div>
    <div class="who">
      <span class="conn ${dbState==='on'?'on':dbState==='demo'?'demo':''}"><i></i>${conn}</span>
      <label>Acting as <select id="me" aria-label="Acting as">${HUMANS.map(h=>`<option value="${h.id}" ${h.id===me?'selected':''}>${h.label}</option>`).join('')}</select></label>
    </div>
  </header>`;
}
// Tokens as people read them: 287k, 1.2M.
function tok(n){ n=Number(n)||0; return n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e3?Math.round(n/1e3)+'k':String(n); }
function costLine(c){
  if(!c) return '';
  const parts=[];
  if(c.runs) parts.push(tok(c.tokens)+' tokens');
  if(c.creditsSpent!=null) parts.push(c.creditsSpent+' credit'+(c.creditsSpent===1?'':'s'));
  return parts.join(' · ');
}
// The project's cost from the runs this page already reads (so it is right even before the
// pipeline has pushed a tally), with credits from the tally tally-cost.js pushed.
function costRows(){
  return scopeItems().map(i=>{ const rs=runs[i.id]||[]; if(!rs.length) return null;
    let t=0,u=0,untr=0; const models=[]; rs.forEach(r=>{ if(r.tokens!=null) t+=Number(r.tokens)||0; else untr++; if(r.turns!=null) u+=Number(r.turns)||0; if(r.model&&!models.includes(r.model)) models.push(r.model); });
    return {id:i.id,name:i.name,t,u,n:rs.length,untr,models}; }).filter(Boolean);
}
function costBox(){
  const rows=costRows();
  const total=rows.reduce((a,r)=>a+r.t,0), turns=rows.reduce((a,r)=>a+r.u,0), n=rows.reduce((a,r)=>a+r.n,0), untr=rows.reduce((a,r)=>a+r.untr,0);
  const c=project&&project.cost||{};
  const credits=c.creditsSpent!=null?`<div class="seat-row"><span>3echo credits</span><b class="num">${c.creditsSpent} of ${c.creditsCeiling??'?'}</b></div>`:'';
  return `<div class="box"><h3>Cost <span>the agents' runs; the orchestrator is not counted</span></h3>
    ${n?`<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><b style="font-size:var(--t5)" class="num">${total.toLocaleString('en-US')}</b><span class="meta">tokens · ${n} run${n===1?'':'s'} · ${turns} turns${untr?` · ${untr} without a count`:''}</span></div>`:'<p class="empty">No runs recorded yet.</p>'}
    ${credits}
    ${rows.length?`<div class="seats">${rows.map(r=>`<button class="seat-row" data-open-item="${r.id}" data-open-tab="output" title="${esc(r.models.join(', '))} · ${r.u} turns"><span><b>${esc(r.name)}</b>${r.n>1?` · ${r.n} runs`:''}</span><span class="num">${tok(r.t)}${total?` · ${Math.round(r.t*100/total)}%`:''}</span></button>`).join('')}</div>`:''}
  </div>`;
}
function statusWord(s){ return {picture:'Picture',audio:'Audio',finish:'Finish',intake:'Intake',stage1:'Stage 1',gate_a:'At Gate A',stage2:'Stage 2',gate_b:'At Gate B',stage3:'Stage 3',gate_c:'At Gate C',released:'Released',killed:'Killed'}[s]||s||''; }
function demoOffer(){ return `<p class="empty" style="margin-top:20px">The board database is not reachable from this view.</p><div class="actions" style="margin-top:10px"><button data-demo>Open the example board</button>${route().page==='project'?`<button class="ghost" data-home>${ic('back')} All projects</button>`:''}</div>`; }
// One project on a slate. On the studio's home page the card also says which pipeline it is in.
function projectCard(p, tagged){
  const k=kindOf(p); const n=Array.isArray(p.steps)&&p.steps.length?p.steps.length:0;
  const sub=projSub(p).filter(Boolean).map(esc).join(' · ');
  const working=p.activity&&!['released','killed'].includes(p.status);
  return `<button class="pcard" data-open="${esc(p.id)}" style="--h:${hueOf(p.id)}">
      <span class="pc-top"><span class="pc-glass">${tagged?`<span class="pc-kind">${esc(PIPES[k].label)}</span>`:''}<h3>${esc(p.title)}</h3>${sub?`<span class="pc-sub">${sub}</span>`:''}</span></span>
      <span class="pc-body">
        <span class="pc-kv"><span>Opened</span><b>${fmt(p.createdAt)}</b><span>By</span><b>${esc(humanName(p.createdBy))}${p.example?' · example data':''}</b>${costLine(p.cost)?`<span>Cost</span><b class="num">${esc(costLine(p.cost))}</b>`:''}<span>${n?'Scope':'Gates'}</span><b>${n?`A la carte · ${n} step${n===1?'':'s'}`:`<span class="gchips" aria-label="Gates passed">${Object.keys(PIPES[k].GATES).map(x=>`<span class="gchip ${gateChipState(p,x)}">${x}</span>`).join('')}</span>`}</b></span>
        <span class="pill ${p.status==='released'?'approved':working?'running':'plain'}">${esc(statusWord(p.status))}</span>
      </span>
      ${working?`<span class="pc-act">${esc(p.activity)}${p.heartbeatAt?' · '+fmt(p.heartbeatAt):''}</span>`:''}
      <span class="pc-dots" aria-hidden="true"></span>
    </button>`;
}
// The studio's front page: the two pipelines as two doors, and everything in flight under them.
function homePage(){
  const live=projects.filter(p=>p.status!=='moved');
  const door=k=>{ const P=PIPES[k]; const mine=live.filter(p=>kindOf(p)===k); const busy=mine.filter(p=>p.activity&&!['released','killed'].includes(p.status)).length;
    return `<button class="hcard k-${k}" data-nav="#/${k}"><span class="mb-ic" aria-hidden="true">${ic(k==='pre'?'flow':'film')}</span><span class="mb-b"><span class="mb-t"><em>${esc(P.label)}.</em> ${esc(P.tag)}</span><span class="mb-s">${P.ITEMS.length} steps, ${Object.keys(P.GATES).length} gates · ${mine.length} project${mine.length===1?'':'s'}${busy?`, ${busy} working`:''}</span></span><span class="mb-btn">Open ${ic('arrow')}</span></button>`; };
  const cards = live.length ? live.map(p=>projectCard(p, true)).join('')
    : dbState==='off' ? demoOffer() : `<p class="empty">${dbState==='connecting'?'Connecting to the board…':'No projects on the board yet. Open one from Pre-production or Post-production.'}</p>`;
  return `<div class="sect"><h2>Production Studio</h2><span class="meta">Two pipelines, one board</span></div>
  <div class="home">${door('pre')}${door('post')}</div>
  <div class="sect"><h2>In flight</h2><span class="meta">${live.length} project${live.length===1?'':'s'}</span></div>
  <div class="slate">${cards}</div>`;
}

  return `<form class="newp" id="newp">
    <div class="np-head"><span class="np-ic" aria-hidden="true">${ic('plus')}</span><div><h3>Open a project</h3><p>Name it, point at the folder, and choose the two things every agent needs to know. The run pulls the folder, routes it and plans the steps from here.</p></div></div>
    <div class="np-fields">

const STAGE0 = {n:0, name:'Intake', sub:''};

// What the step is holding beyond its summary: rows entered, references chosen, panels drawn.
function stepCount(it){
  if(KIND==='post'){
    if(it.id==='bgm') return bgm.length?`${bgm.length} candidate${bgm.length===1?'':'s'}${it.choiceTitle?', chosen: '+it.choiceTitle:''}`:'';
    if(it.id==='broll'){ const rs=brollReqs(); const q=rs.filter(r=>r.status==='quoted').length; return rs.length?`${rs.length} request${rs.length===1?'':'s'}${q?`, ${q} quoted`:''}`:''; }
    if(it.id==='mograph') return mograph.length?`${mograph.filter(m=>m.thumb).length} of ${mograph.length} rendered`:'';
    return '';
  }
  if(REG_FIELDS[it.id]) return regs[it.id].length?`${regs[it.id].length} row${regs[it.id].length===1?'':'s'}${regUnknowns(it.id)?`, ${regUnknowns(it.id)} with blanks`:''}`:'';
  if(it.id==='scraper'&&refs.length) return `${chosenCount()} of ${refs.length} chosen`;
  if(it.id==='storyboard'&&panels.length) return `${panels.filter(p=>p.thumb).length} of ${panels.length} drawn`;
  return '';
}
// What a step is holding, shown on its card: the picture or the cut where there is one, the
// choices where a person picks, the first rows of a register or a sheet, else the opening lines
// of what the agent wrote. The card still opens the chat; the Open button beside it opens the work.
function excerpt(s){
  const ls=String(s||'').split('\n').map(l=>l.replace(/^#+\s*/,'').replace(/\*\*/g,'').replace(/^\s*[-*]\s+/,'').trim()).filter(l=>l&&!/^\|?[-:| ]+\|?$/.test(l));
  return ls.slice(0,2).map(l=>l.replace(/^\|\s*/,'').replace(/\s*\|$/,'').replace(/\s*\|\s*/g,' · ')).join(' — ').slice(0,220);
}
function stepSnippet(it){

  if(KIND==='post'){
    if(it.id==='bgm'&&bgm.length) return chips(bgm.slice(0,4).map(c=>`<i class="sx-chip ${c.chosen?'on':''}">${ic('music')}${esc(c.title||c.id)}${c.durationSec?` <u>${tc(c.durationSec)}</u>`:''}${c.chosen?' <u>chosen</u>':''}</i>`));
    if(it.id==='broll'){ const rs=brollReqs(); if(rs.length) return chips(rs.slice(0,3).map(r=>`<i class="sx-chip ${r.status==='delivered'?'on':''}">${esc(String(r.shot||r.text||'').slice(0,40))} <u>${esc(r.status==='quoted'?(r.credits||'?')+' credits quoted':r.status==='open'?'generating':r.status||'')}</u></i>`)); }
    if(it.id==='mograph'){ const th=mograph.filter(m=>safeImg(m.thumb)).map(m=>m.thumb); if(th.length) return strip(th); }
  }
  if(it.id==='scraper'&&refs.length){ const ch=refs.filter(r=>refsel[r.id]&&refsel[r.id].selected); const list=(ch.length?ch:refs); return chips(list.slice(0,3).map(r=>`<i class="sx-chip ${ch.length?'on':''}">${esc(String(r.title||r.url||'').slice(0,36))}</i>`).concat(list.length>3?[`<i class="sx-chip more">+${list.length-3}</i>`]:[])); }
  if(REG_FIELDS[it.id]&&regs[it.id].length) return chips(regs[it.id].slice(0,4).map(r=>`<i class="sx-chip">${esc(String(r.name||'unnamed').slice(0,28))}</i>`).concat(regs[it.id].length>4?[`<i class="sx-chip more">+${regs[it.id].length-4}</i>`]:[]));

function stepRow(it, model){

function inboxHtml(){

// The chat is assembled from what the board already holds: an agent's runs are its messages, a

function questionMsgs(r, out){

function logMsgs(m, out){

function runBubble(it, r){

function chatMsgs(seat){

      else out.push({side:'me', at:m.at, who:humanName(m.by), html:`<p>${esc(t)}</p>${m.files&&m.files.length?fileChips(m.files):''}`}); });
  } else {
    for(const it of seatItems(seat.id)){
      const rs=runsOf(it.id);
      rs.filter(r=>r.status!=='running').forEach(r=>out.push({side:'a', at:r.finishedAt||r.startedAt, html:runBubble(it,r)}));

  const p = (rec&&(rec.path||rec.file)) || it.artifactPath || it.file;

    if(t.dataset.export){ await guarded('x'+t.dataset.export, ()=>requestExport(t.dataset.export)); return; }
    if(t.dataset.gen){ const k='gen-'+t.dataset.gen; if(!isArmed(k)){ arm(k); toast('Press again to confirm. Credits are spent on 3echo.'); return; } armed=null; await guarded(k, ()=>requestGenerate(t.dataset.gen)); return; }
    if(t.dataset.chooseBgm){ const id=t.dataset.chooseBgm; if(!isArmed('bgm'+id)){ arm('bgm'+id); toast('Press again to confirm the music'); return; } armed=null; await guarded('bgm'+id, ()=>chooseBgm(id)); return; }
    if(t.dataset.approveReq){ const r=inbox.find(x=>x.id===t.dataset.approveReq); if(!r) return; if(!isArmed('q'+r.id)){ arm('q'+r.id); toast('Press again to confirm. Credits are spent on 3echo.'); return; } armed=null; await guarded('q'+r.id, ()=>approveBroll(r)); return; }
    if(t.dataset.declineReq){ const r=inbox.find(x=>x.id===t.dataset.declineReq); if(r) await guarded('d'+r.id, ()=>declineBroll(r)); return; }
    if(t.dataset.approveAlpha){ await guarded('al'+t.dataset.approveAlpha, ()=>approveMograph(t.dataset.approveAlpha)); return; }
    if(t.dataset.approvePanel){ await guarded('pp'+t.dataset.approvePanel, ()=>approvePanel(t.dataset.approvePanel)); return; }
    if(t.dataset.refToggle){ await guarded('rf'+t.dataset.refToggle, ()=>toggleRef(t.dataset.refToggle)); return; }
    if(t.dataset.redoCancel!=null){ redoFor=null; render(); return; }
    if(t.dataset.redo){ redoFor = redoFor===t.dataset.redo ? null : t.dataset.redo; render(); const ta=document.getElementById('redo-'+t.dataset.redo); if(ta) ta.focus(); return; }
    if(t.dataset.answer){ const r=inbox.find(x=>x.id===t.dataset.answer); if(r) await answer(r, t.dataset.value); return; }
  };
  app.onsubmit = async e=>{
    e.preventDefault(); const f=e.target; if(f.classList.contains('composer')) chatJump=true;
    if(f.id==='newp') return createProject(f);
    if(f.id==='newpost') return createPostProject(f);
    if(f.id==='brollf') return guarded('brollf', ()=>requestBroll(f));
    if(f.id==='msgf'){ if(attachBusy){ toast('Still uploading; send in a moment'); return; } const v=f.text.value.trim()||(attach.length?'See the attached file'+(attach.length>1?'s':''):''); if(!v) return; const fs=takeFiles(); f.reset(); await signalPipeline('Message from '+humanName(me)+': '+v.slice(0,80), 'Message on the board from '+humanName(me)+': '+v+'. Read it, act on it if it asks for something, and reply in chat.'+filesOrder(fs)); await log(v, null, fs); f.reset(); toast('Sent to the run', 'ok'); return; }
    if(f.dataset.reg) return addRow(f.dataset.reg, f);
    if(f.dataset.redoForm){ const v=f.text.value.trim(); if(!v) return; redoFor=null; await redoPanel(f.dataset.redoForm, v); return; }
    if(f.id==='changef'){ if(attachBusy){ toast('Still uploading; send in a moment'); return; } const v=f.text.value.trim(); if(!v) return; changeFor=null; await requestChange(f.dataset.item, v, takeFiles()); return; }
    if(f.dataset.answerForm){ const r=inbox.find(x=>x.id===f.dataset.answerForm); const v=f.text.value.trim(); if(r&&v){ await answer(r, v); } return; }
    if(f.id==='notef'){ if(attachBusy){ toast('Still uploading; send in a moment'); return; } const v=f.text.value.trim()||(attach.length?'See the attached file'+(attach.length>1?'s':''):''); if(!v||!project) return; const fs=takeFiles(); f.reset(); const id=f.dataset.item; const it=itemOf(id);
      if(it.status!=='pending') await write('projects/'+project.id+'/inbox/'+Date.now().toString(36),{type:'change',item:id,text:v,from:me,status:'open',createdAt:now(), ...(fs.length?{files:fs}:{})});
      await log(`Note to ${seatLabel(it.seat)} on ${it.name} v${it.version||0}: ${v}`, id, fs); toast('Sent to '+seatLabel(it.seat), 'ok'); await signalPipeline('Note to '+seatLabel(it.seat)+' on '+it.name+': '+v.slice(0,80), noteOrder(it, v, fs)); return; }
  };
  const sel=$('#me'); if(sel) sel.onchange=()=>{ me=sel.value; try{localStorage.setItem('c122.me',me);}catch(e){} render(); };
  // Enter sends a chat message; Shift+Enter starts a new line.
  app.onkeydown = e=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.matches&&e.target.matches('.composer textarea')){ e.preventDefault(); e.target.form.requestSubmit(); } };
  // Files: dropped anywhere on the open chat, pasted into its box, or picked with the paperclip.
  const overChat=e=>e.target&&e.target.closest?e.target.closest('.chat'):null;
  app.ondragover = e=>{ const c=overChat(e); if(!c||!e.dataTransfer||![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); c.classList.add('drop'); };
  app.ondragleave = e=>{ const c=overChat(e); if(c&&!c.contains(e.relatedTarget)) c.classList.remove('drop'); };
  app.ondrop = e=>{ const c=overChat(e); if(!c||!e.dataTransfer||!e.dataTransfer.files.length) return; e.preventDefault(); c.classList.remove('drop'); chatJump=true; addFiles(e.dataTransfer.files); };
  app.onpaste = e=>{ if(e.target.matches&&e.target.matches('.composer textarea')&&e.clipboardData&&e.clipboardData.files.length){ e.preventDefault(); addFiles(e.clipboardData.files); } };
  const fin=$('#attach-in'); if(fin) fin.onchange=()=>{ const fl=[...fin.files]; fin.value=''; addFiles(fl); };
  const rsel=$('#runsel'); if(rsel) rsel.onchange=()=>{ runSel=rsel.value; render(); };
}
boot();
</script>
